# 리허설 ② C·E-② — OIDC 로 AWS 역할 가정. 계정 ID 는 저장소 Secret AWS_ACCOUNT_ID 에서만 읽는다(파일에 없음).
# 앞서 reh2-mask-fake 에서 부분 문자열 가림이 확인된 뒤에만 push 한다.
name: reh2-aws
on:
  pull_request:
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ap-northeast-2
jobs:
  plan-allowed:
    # sub = …:pull_request → plan 역할의 신뢰 조건과 같다 → 성공해야 한다.
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0   # 시험 뒤 커밋 sha 고정안을 따로 확인
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agentic-devops-reh2-plan
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - run: aws sts get-caller-identity --query Arn --output text
  lowercase-control-denied:
    # 신뢰 조건이 소문자 sub → StringEquals 대소문자 구분이면 거절돼야 한다(= 오류 문구 ① 재현).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agentic-devops-reh2-lowercase-control
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
  apply-denied-from-probe-environment:
    # 환경 probe 의 sub 로 apply 역할(environment:apply 조건)을 가정 → 거절.
    runs-on: ubuntu-latest
    environment: probe
    continue-on-error: true
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agentic-devops-reh2-apply
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
